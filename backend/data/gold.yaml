  reference_answer: "Chỉ khi tổng lượng khí đốt tồn chứa trên 500 kg: khi đó cửa hàng thuộc danh mục phải mua bảo hiểm cháy, nổ bắt buộc (NĐ 105/2025, Phụ lục VII, Mục 15; Điều 35 Khoản 1). Dưới ngưỡng đó, nghị định chỉ khuyến khích mua."
  source_unit_ids: ["pccc-decree-105-2025#dieu-35#khoan-1", "pccc-decree-105-2025#phu-luc-7#muc-15"]
  multi_hop: true
  answer_must_match: ['500\s*kg']
  answer_must_not_match: ['xăng dầu']

