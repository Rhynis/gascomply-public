  question: "LPG thương phẩm bán ra thị trường phải đạt hàm lượng lưu huỳnh, áp suất hơi tối đa bao nhiêu theo quy chuẩn sản phẩm?"
  reference_answer: "Không tìm thấy quy định phù hợp trong dữ liệu hiện có. Chỉ tiêu chất lượng sản phẩm LPG thương phẩm (như hàm lượng lưu huỳnh, áp suất hơi) thuộc QCVN 08:2019/BKHCN, văn bản đã có trong danh mục corpus nhưng chưa được tải nội dung; vui lòng kiểm tra bản hiệu lực mới nhất trên vbpl.vn."
