- id: multihop-gas-store-800kg-insurance
  category: multi_hop
  question: "Cửa hàng gas chứa 800 kg khí có phải mua bảo hiểm cháy, nổ bắt buộc không?"
  reference_answer: "Có. Cơ sở kinh doanh khí đốt có tổng lượng khí đốt tồn chứa trên 500 kg thuộc danh mục phải mua bảo hiểm cháy, nổ bắt buộc (NĐ 105/2025, Phụ lục VII, Mục 15), và cơ sở thuộc danh mục đó phải mua bảo hiểm cháy, nổ bắt buộc đối với tài sản của cơ sở (NĐ 105/2025, Điều 35 Khoản 1). 800 kg vượt ngưỡng đó."
