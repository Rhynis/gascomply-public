[project]
name = "gascomply-backend"
version = "0.1.0"
description = "Citation-grounded GraphRAG assistant for Vietnamese LPG-business and fire-safety (PCCC) regulations."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
    "selectolax>=1.0.0",
    # Pinned exactly: PDF text extraction must be reproducible across environments.
    # 6.21.2 clears all eleven CVE advisories open against 6.19.0/6.20.x (issue #153).
    # Its own layout heuristic drifted from 6.19.0's -- extra inter-word spaces and a
    # few differently-split words -- which ``ingest/extract.py``'s own whitespace
    # collapse (``_collapse_line_whitespace``) absorbs; the split words that remain
    # are listed in issue #153's own measurement, not repaired here.
    # 6.21.4 clears seven more CVE advisories open against 6.21.2 (issue #171), with
    # zero extraction drift measured over the full corpus (same method as #153) --
    # no further code change needed. Upgrade again only with the same
    # byte-identical-modulo-whitespace extraction check over every corpus PDF.
    "pypdf==6.21.4",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "httpx2>=2.12",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.9",
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "ingest", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
    "RUF",  # ruff-specific
    "T20",  # flake8-print (C6: no print, use the logger)
    "C901",    # mccabe cyclomatic complexity (C10: function complexity <= 10)
    "PLR0913", # pylint: too many arguments (C10: <= 5 parameters)
    "PLR0912", # pylint: too many branches (C10)
    "PLR0915", # pylint: too many statements (C10)
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "ANN201", "ANN401"]
# The CLI's whole job is writing a report to stdout (C6's "no print" is about
# business code using the logger instead; a CLI's report is output, not logging).
"ingest/run.py" = ["T20"]
"ingest/review.py" = ["T20"]
"eval/compare.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov=ingest --cov-report=term-missing --cov-fail-under=80"
# A warning nobody reads is a deprecation with somebody else's deadline on it.
# Turning them into errors is how one stays a one-line fix instead of becoming a
# breaking change on an upgrade. Every ignore below is scoped to a single warning
# class and owned by an issue -- never a blanket ignore (C11).
filterwarnings = [
    "error",
    # Fires at import from fastapi.testclient/starlette.testclient, which
    # tests/conftest.py uses, so it aborts collection rather than one test.
    # Confirmed still present on the latest resolvable versions as of issue
    # #25 (fastapi 0.141.1, starlette 1.6.0, anyio 4.15.1): starlette's own
    # testclient.py module-level code still spells out the deprecated
    # anyio.abc.BlockingPortal alias directly, independent of which HTTP
    # client it uses. Nothing in this project can fix that; it needs a
    # starlette release that updates its own import. Re-check on the next
    # starlette bump.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
omit = ["app/__main__.py"]
